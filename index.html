<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#070708"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FLAME"/>
<title>FLAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#08080a;--card:#16161c;--line:#ffffff14;--txt:#f4f1ea;--mut:#9a958c;--flame:linear-gradient(135deg,#fffc00,#ff8a00 55%,#ff3d00);--me:linear-gradient(135deg,#ffb703,#fb8500);--them:#23232c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.on{display:flex}
.logo{font-family:Syne,sans-serif;font-weight:800;letter-spacing:.14em;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.hidden{display:none!important}
.splash{align-items:center;justify-content:center;gap:10px}
.blob{width:92px;height:92px;border-radius:26px;background:var(--flame);display:grid;place-items:center;font-size:42px;box-shadow:0 12px 40px #ff8a0044}
.auth-card{padding:24px 20px 32px;background:#0e0e12;border-top:1px solid var(--line);border-radius:28px 28px 0 0;margin-top:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0a0a0e;padding:4px;border-radius:14px;margin:14px 0}
.tab{padding:12px;border-radius:11px;color:var(--mut);font-weight:800}
.tab.on{background:#1d1d24;color:#fff}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}
input{width:100%;background:#0a0a0e;border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{border-radius:14px;padding:14px;font-weight:800;width:100%;margin-top:10px}
.btn-p{background:var(--flame);color:#111}
.btn-g{background:#1a1a22;border:1px solid var(--line)}
.btn-m{width:auto;padding:8px 12px;border-radius:999px;background:var(--flame);color:#111;font-size:13px;margin:0}
.err{color:#ff4d6d;font-size:14px;margin-top:8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px 8px;gap:8px}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#111;flex-shrink:0;font-family:Syne,sans-serif}
.av.s{width:36px;height:36px;border-radius:12px}
.av.x{width:88px;height:88px;border-radius:28px;font-size:32px;margin:8px auto}
.search{padding:0 14px 8px}
.search input{border-radius:999px}
.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 100px}
.row{display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left;border-radius:16px}
.row:active{background:#14141a}
.grow{flex:1;min-width:0}
.name{font-weight:800;display:flex;gap:6px;align-items:center}
.sub{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));background:#121218ee;border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;align-items:center;padding:8px}
.dock b{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;font-weight:700;min-width:60px}
.dock b.on{color:#fff}
.cam{width:56px;height:56px;border-radius:18px;background:var(--flame);color:#111;display:grid;place-items:center;font-size:22px}
.msgs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:10px 12px;border-radius:18px}
.me{align-self:flex-end;background:var(--me);color:#1a1004;border-bottom-right-radius:6px}
.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:6px}
.bub img{width:210px;max-width:68vw;border-radius:12px}
.meta{font-size:11px;opacity:.65;text-align:right;margin-top:3px}
.comp{display:flex;gap:6px;align-items:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0c0c10}
.comp input{border-radius:999px}
.send{width:44px;height:44px;border-radius:14px;background:var(--flame);color:#111;font-size:18px;flex-shrink:0}
.emojis{display:flex;gap:6px;overflow:auto;padding:6px 10px;background:#0c0c10;border-top:1px solid var(--line)}
.emojis button{font-size:22px;padding:4px}
.pad{padding:10px 18px 28px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:20;white-space:nowrap}
.banner{margin:0 14px 8px;padding:10px 12px;border-radius:14px;background:#ff8a0028;display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;padding:40px 24px;color:var(--mut)}
.themes{display:flex;gap:8px}
.themes button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line)}
.lb{position:absolute;inset:0;background:#000d;display:grid;place-items:center;z-index:30}
.lb img{max-width:100%;max-height:100%}
.video,.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:6px solid #fff6;margin:0 auto}
.chip{display:inline-flex;padding:6px 12px;border-radius:999px;background:#16161c;border:1px solid var(--line);color:var(--mut)}
.day{align-self:center;font-size:11px;color:var(--mut);background:#14141a;padding:4px 10px;border-radius:999px}
body.ice{--bg:#071018;--card:#10202b;--me:linear-gradient(135deg,#7df,#4af);--them:#163044}
body.neon{--bg:#0b0612;--card:#1a1024;--me:linear-gradient(135deg,#f0f,#80f);--them:#261433}
</style>
</head>
<body>
<div id="app">
<section class="view splash on" id="v-splash"><div class="blob">🔥</div><h1 class="logo">FLAME</h1></section>
<section class="view" id="v-auth">
  <div class="auth-card">
    <div class="blob" style="width:64px;height:64px;font-size:28px;margin:-54px auto 8px">🔥</div>
    <h1 class="logo" style="text-align:center">FLAME</h1>
    <p style="text-align:center;color:var(--mut)">Username wie Roblox. Keine E-Mail.</p>
    <div class="tabs"><button class="tab on" data-a="login">Login</button><button class="tab" data-a="reg">Neu</button></div>
    <form id="f-login"><label>Username</label><input id="l-user" maxlength="16" autocapitalize="none"><label>Passwort</label><input id="l-pass" type="password"><button class="btn btn-p">Rein</button></form>
    <form id="f-reg" class="hidden"><label>Username</label><input id="r-user" maxlength="16" autocapitalize="none"><label>Name</label><input id="r-name" maxlength="20"><label>Passwort</label><input id="r-pass" type="password"><button class="btn btn-p">Account erstellen</button></form>
    <p id="auth-err" class="err hidden"></p>
  </div>
</section>
<section class="view" id="v-home">
  <header class="top"><button class="ico av s" id="btn-me">F</button><span class="logo">FLAME</span><button class="ico" id="btn-add">＋</button></header>
  <div class="search"><input id="q" placeholder="Suchen…"></div>
  <div id="req-ban" class="banner hidden"><span id="req-t">Anfragen</span><button class="btn-m" id="btn-req">Ansehen</button></div>
  <div id="chats" class="list"></div>
  <div id="empty" class="empty hidden"><div style="font-size:40px">🔥</div><h3 style="color:#fff">Noch keine Chats</h3><p>Add Freunde oder schreib FlameBot.</p></div>
  <nav class="dock">
    <b class="on" data-go="home">💬<span>Chats</span></b>
    <button class="cam" id="dock-cam">📷</button>
    <b data-go="friends">👥<span>Freunde</span></b>
  </nav>
</section>
<section class="view" id="v-friends">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Freunde</b><button class="ico" id="btn-add2">＋</button></header>
  <div id="flist" class="list"></div>
</section>
<section class="view" id="v-add">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Adden</b><span></span></header>
  <div class="pad">
    <form id="f-add"><input id="add-u" placeholder="username" maxlength="16" autocapitalize="none"><button class="btn btn-p">Anfrage senden</button></form>
    <p id="add-m" class="sub"></p>
    <div class="card"><b>So gehts</b><p class="sub">Sag deinem Freund deinen Username. Der steht in deinem Profil.</p></div>
  </div>
</section>
<section class="view" id="v-req">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Anfragen</b><span></span></header>
  <div id="rlist" class="list"></div>
</section>
<section class="view" id="v-chat">
  <header class="top">
    <button class="ico" data-back="home">‹</button>
    <div class="grow" style="display:flex;gap:8px;align-items:center"><div class="av s" id="p-av">?</div><div><b id="p-name">—</b><div class="sub" id="p-st"></div></div></div>
    <div id="p-streak" class="chip hidden">🔥 0</div>
  </header>
  <div id="msgs" class="msgs"></div>
  <div id="emo" class="emojis hidden">
    <button>🔥</button><button>😂</button><button>❤️</button><button>😍</button><button>💀</button><button>👍</button><button>😭</button><button>🎉</button><button>😎</button><button>🥺</button>
  </div>
  <form id="comp" class="comp">
    <button type="button" class="ico" id="btn-emo">☺</button>
    <button type="button" class="ico" id="btn-pic">🖼</button>
    <input id="minp" maxlength="1500" placeholder="Nachricht…">
    <button class="send" type="submit">➤</button>
  </form>
  <input id="file" type="file" accept="image/*" hidden>
</section>
<section class="view" id="v-cam">
  <video id="vid" class="video" autoplay playsinline></video>
  <img id="shot" class="prev hidden" alt="">
  <div class="camui">
    <button class="ico" data-back="home" style="background:#0008;color:#fff">✕</button>
    <div>
      <button class="shutter" id="shut"></button>
      <button class="btn btn-p hidden" id="sendshot" style="width:auto;margin:12px auto">Senden 🔥</button>
    </div>
  </div>
</section>
<section class="view" id="v-set">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Profil</b><span></span></header>
  <div class="pad" style="text-align:center">
    <div class="av x" id="me-av">F</div>
    <h2 id="me-n">—</h2>
    <button class="chip" id="copyu">@<span id="me-u">—</span></button>
    <div class="card" style="text-align:left"><b>Theme</b><div class="themes" style="margin-top:8px"><button data-th="">Dark</button><button data-th="ice">Ice</button><button data-th="neon">Neon</button></div></div>
    <div class="card" style="text-align:left"><b>Status</b><input id="st-in" maxlength="60" placeholder="Was geht?" style="margin-top:8px"><button class="btn btn-g" id="save-st">Speichern</button></div>
    <div class="card" style="text-align:left"><b>Sounds</b><button class="btn btn-g" id="tog-snd">An / Aus</button></div>
    <button class="btn btn-g" id="out">Abmelden</button>
  </div>
</section>
<div id="lb" class="lb hidden"><img id="lbimg" alt=""></div>
<div id="toast" class="toast hidden"></div>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {s:"fl2_s", d:"fl2_d", th:"fl2_th", snd:"fl2_snd"};
const BOT = {id:"bot", username:"flamebot", display:"FlameBot", online:true};
const S = {user:null, chats:{}, friends:{}, reqs:{}, msgs:{}, users:{}, active:null, shot:null, stream:null, snd: localStorage.getItem(LS.snd)!=="0"};
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const now = () => Date.now();
const day = (t=Date.now()) => {const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const yest = dk => {const [y,m,da]=dk.split("-").map(Number); const x=new Date(y,m-1,da); x.setDate(x.getDate()-1); return day(x.getTime())};
const cid = (a,b)=>[a,b].sort().join("__");
const other = (id,me)=>id.split("__").find(x=>x!==me);
const ini = n => (n||"?").trim()[0].toUpperCase();
const hue = s => {let h=0; for(const c of (s||"")) h=(h*31+c.charCodeAt(0))>>>0; return h%360};
const avs = s => `background:linear-gradient(135deg,hsl(${hue(s)},90%,60%),hsl(${(hue(s)+40)%360},90%,48%))`;
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add("hidden"),1800)}
function beep(){ if(!S.snd) return; try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=880; g.gain.value=.04; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.08);}catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(12);}catch(e){} }
function db(){ try{ return JSON.parse(localStorage.getItem(LS.d))||empty()}catch(e){return empty()} }
function empty(){ return {users:{}, names:{}, friends:{}, reqs:{}, chats:{}, msgs:{}} }
function save(d){ localStorage.setItem(LS.d, JSON.stringify(d)); }
async function sha(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fl2::"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("") }
function show(n){ $$(".view").forEach(v=>v.classList.remove("on")); $("#v-"+n).classList.add("on"); if(n!=="cam") stopCam(); }
function seedBot(d){
  d.users[BOT.id]=BOT; d.names.flamebot=BOT.id;
  if(S.user){
    d.friends[S.user.id]=d.friends[S.user.id]||{}; d.friends[S.user.id][BOT.id]=true;
    const id=cid(S.user.id,BOT.id);
    if(!d.chats[id]) d.chats[id]={id,a:S.user.id,b:BOT.id,lastText:"Hey, ich bin FlameBot 🔥",lastAt:now(),streak:0,lastDay:"",pa:"",pb:"",unread:{[S.user.id]:1,[BOT.id]:0}};
    d.msgs[id]=d.msgs[id]||{};
    if(!Object.keys(d.msgs[id]).length){
      d.msgs[id].hello={id:"hello",from:BOT.id,type:"text",text:"Hey! Schreib mir oder schick ein Foto. Add deinen Freund mit ＋",at:now()};
    }
  }
  return d;
}
function load(){
  const d=seedBot(db());
  S.users=d.users; S.friends=(d.friends[S.user.id]||{}); S.reqs=(d.reqs[S.user.id]||{});
  S.chats={}; Object.values(d.chats||{}).forEach(c=>{ if(c.a===S.user.id||c.b===S.user.id) S.chats[c.id]=c; });
  S.msgs=d.msgs||{};
}
function fmt(t){ const x=now()-t; if(x<60000) return "jetzt"; if(x<3600000) return Math.floor(x/60000)+"m"; return new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function clock(t){ return new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function user(id){ if(id===BOT.id) return BOT; if(S.user&&S.user.id===id) return S.user; return S.users[id]||{display:"User",username:"user",id}; }
function streakOf(c){ if(!c) return 0; if(c.lastDay && c.lastDay!==day() && c.lastDay!==yest(day())) return 0; return c.streak||0; }
function renderHome(){
  $("#btn-me").textContent=ini(S.user.display);
  $("#btn-me").setAttribute("style", avs(S.user.username));
  const rq=Object.keys(S.reqs||{});
  $("#req-ban").classList.toggle("hidden",!rq.length);
  $("#req-t").textContent=rq.length+" Anfrage"+(rq.length===1?"":"n");
  const q=($("#q").value||"").toLowerCase();
  const rows=Object.values(S.chats).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0)).filter(c=>{
    const o=user(other(c.id,S.user.id));
    return !q || (o.display+" "+o.username).toLowerCase().includes(q);
  });
  $("#empty").classList.toggle("hidden", rows.length>0);
  $("#chats").innerHTML=rows.map(c=>{
    const o=user(other(c.id,S.user.id));
    const un=(c.unread&&c.unread[S.user.id])||0;
    const st=streakOf(c);
    return `<button class="row" data-open="${c.id}"><div class="av" style="${avs(o.username)}">${ini(o.display)}</div><div class="grow"><div class="name">${esc(o.display)} ${st?("<span>🔥"+st+"</span>"):""}</div><div class="sub">${esc(c.lastText||"")}</div></div><div style="text-align:right"><div class="sub">${c.lastAt?fmt(c.lastAt):""}</div>${un?("<b style=\"background:var(--flame);color:#111;border-radius:99px;padding:0 6px;font-size:12px\">"+un+"</b>"):""}</div></button>`;
  }).join("");
}
function renderFriends(){
  const ids=Object.keys(S.friends||{});
  $("#flist").innerHTML = ids.length? ids.map(id=>{
    const u=user(id);
    return `<div class="row"><div class="av" style="${avs(u.username)}">${ini(u.display)}</div><div class="grow"><b>${esc(u.display)}</b><div class="sub">@${esc(u.username)}</div></div><button class="btn-m" data-open="${cid(S.user.id,id)}">Chat</button></div>`;
  }).join("") : `<div class="empty">Noch keine Freunde</div>`;
}
function renderReq(){
  const ids=Object.keys(S.reqs||{});
  $("#rlist").innerHTML = ids.length? ids.map(id=>{
    const u=user(id);
    return `<div class="row"><div class="av" style="${avs(u.username)}">${ini(u.display||"?")}</div><div class="grow"><b>${esc(u.display||id)}</b></div><button class="btn-m" data-ok="${id}">Ja</button><button class="ico" data-no="${id}">✕</button></div>`;
  }).join("") : `<div class="empty">Keine Anfragen</div>`;
}
function renderChat(){
  const id=S.active; if(!id) return;
  const o=user(other(id,S.user.id));
  $("#p-name").textContent=o.display;
  $("#p-st").textContent=o.id===BOT.id?"immer da":"";
  $("#p-av").textContent=ini(o.display);
  $("#p-av").setAttribute("style", avs(o.username));
  const st=streakOf(S.chats[id]);
  $("#p-streak").classList.toggle("hidden",!st);
  $("#p-streak").textContent="🔥 "+st;
  const list=Object.values(S.msgs[id]||{}).sort((a,b)=>a.at-b.at).slice(-120);
  let last="";
  $("#msgs").innerHTML=list.map(m=>{
    const d=day(m.at); let sep="";
    if(d!==last){ sep=`<div class="day">${d===day()?"Heute":new Date(m.at).toLocaleDateString("de-DE")}</div>`; last=d; }
    const mine=m.from===S.user.id;
    const body=m.type==="img"?`<img src="${m.image}" alt="">${m.text?("<div>"+esc(m.text)+"</div>"):""}`:`<div>${esc(m.text||"")}</div>`;
    return sep+`<div class="bub ${mine?"me":"them"}">`+body+`<div class="meta">${clock(m.at)}</div></div>`;
  }).join("");
  $("#msgs").scrollTop=99999;
}
function applyStreak(c, from){
  const t=day();
  if(c.a===from) c.pa=t; else c.pb=t;
  if(c.pa===t && c.pb===t){
    if(c.lastDay===t) return c;
    if(!c.lastDay || c.lastDay===yest(t) || !c.streak){ c.streak=(c.lastDay===yest(t)?c.streak:0)+1; c.lastDay=t; }
    else { c.streak=1; c.lastDay=t; }
  } else if(c.lastDay && c.lastDay!==t && c.lastDay!==yest(t)) c.streak=0;
  return c;
}
function send(id, msg){
  msg.id=msg.id||uid(); msg.at=now();
  const d=db();
  d.msgs[id]=d.msgs[id]||{}; d.msgs[id][msg.id]=msg;
  let c=d.chats[id];
  if(c){
    applyStreak(c,msg.from);
    c.lastText=msg.type==="img"?"📷 Foto":msg.text;
    c.lastAt=msg.at;
    c.unread=c.unread||{};
    const oth=other(id,msg.from);
    c.unread[oth]=(c.unread[oth]||0)+1;
    d.chats[id]=c;
  }
  save(d); load();
  if(S.active===id) renderChat();
  renderHome(); beep(); buzz();
  if(other(id,S.user.id)===BOT.id && msg.from===S.user.id) setTimeout(()=>botReply(id,msg),400+Math.random()*500);
}
const BOT_LINES=["Nice 🔥","Yo!","Streak nicht vergessen.","Haha","Schick noch ein Foto","Das ist clean","Add deinen Freund oben rechts mit ＋","FLAME bleibt an.","Guter Move","Same"];
function botReply(id, msg){ send(id,{from:BOT.id,type:"text",text: msg.type==="img"?"Krasses Foto 🔥":BOT_LINES[Math.floor(Math.random()*BOT_LINES.length)]}); }
async function compress(file){
  const img=new Image(); const url=URL.createObjectURL(file);
  await new Promise((ok,err)=>{img.onload=ok; img.onerror=err; img.src=url});
  const sc=Math.min(1,900/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",.55);
}
function stopCam(){ if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
async function after(u){ S.user=u; localStorage.setItem(LS.s, JSON.stringify({id:u.id,username:u.username})); const d=seedBot(db()); save(d); load(); renderHome(); show("home"); }
function bind(){
  $$(".tab").forEach(t=>t.onclick=()=>{ $$(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on"); $("#f-login").classList.toggle("hidden", t.dataset.a!=="login"); $("#f-reg").classList.toggle("hidden", t.dataset.a!=="reg"); });
  $("#f-login").onsubmit=async e=>{ e.preventDefault(); try{ const d=db(); const name=$("#l-user").value.toLowerCase().trim(); const id=d.names[name]; if(!id) throw new Error("User nicht gefunden"); const u=d.users[id]; if(u.pass!==await sha($("#l-pass").value)) throw new Error("Falsches Passwort"); await after(u);}catch(err){ $("#auth-err").textContent=err.message; $("#auth-err").classList.remove("hidden"); } };
  $("#f-reg").onsubmit=async e=>{ e.preventDefault(); try{ const username=$("#r-user").value.toLowerCase().trim(); const display=$("#r-name").value.trim(); const pass=$("#r-pass").value; if(!/^[a-z0-9_]{3,16}$/.test(username)) throw new Error("Username: 3–16, nur a-z 0-9 _"); if(!display) throw new Error("Name fehlt"); if(pass.length<4) throw new Error("Passwort zu kurz"); const d=db(); if(d.names[username]) throw new Error("Username weg"); const u={id:uid(),username,display,pass:await sha(pass),status:"Neue Flamme 🔥",online:true}; d.users[u.id]=u; d.names[username]=u.id; save(d); await after(u); toast("Account steht"); }catch(err){ $("#auth-err").textContent=err.message; $("#auth-err").classList.remove("hidden"); } };
  $("#btn-me").onclick=()=>{ $("#me-av").textContent=ini(S.user.display); $("#me-av").setAttribute("style", avs(S.user.username)); $("#me-n").textContent=S.user.display; $("#me-u").textContent=S.user.username; $("#st-in").value=S.user.status||""; show("set"); };
  $("#btn-add").onclick=$("#btn-add2").onclick=()=>{ $("#add-m").textContent=""; show("add"); };
  $("#btn-req").onclick=()=>{ renderReq(); show("req"); };
  $$("[data-back]").forEach(b=>b.addEventListener("click",()=>{ load(); renderHome(); show(b.getAttribute("data-back")); }));
  $$(".dock b[data-go]").forEach(b=>b.onclick=()=>{ $$(".dock b").forEach(x=>x.classList.remove("on")); b.classList.add("on"); if(b.dataset.go==="friends"){ renderFriends(); show("friends"); } else { renderHome(); show("home"); } });
  $("#q").oninput=renderHome;
  const openChat=e=>{ const r=e.target.closest("[data-open]"); if(!r) return; S.active=r.dataset.open; const d=db(); if(d.chats[S.active]){ d.chats[S.active].unread=d.chats[S.active].unread||{}; d.chats[S.active].unread[S.user.id]=0; save(d); load(); } renderChat(); show("chat"); };
  $("#chats").onclick=openChat; $("#flist").onclick=openChat;
  $("#f-add").onsubmit=e=>{ e.preventDefault(); const name=$("#add-u").value.toLowerCase().trim(); const d=db(); const id=d.names[name]; if(!id){ $("#add-m").textContent="Username nicht gefunden."; return; } if(id===S.user.id){ $("#add-m").textContent="Das bist du."; return; } d.friends[S.user.id]=d.friends[S.user.id]||{}; d.friends[id]=d.friends[id]||{}; d.friends[S.user.id][id]=true; d.friends[id][S.user.id]=true; const idc=cid(S.user.id,id); d.chats[idc]=d.chats[idc]||{id:idc,a:S.user.id,b:id,lastText:"Verbunden 🔥",lastAt:now(),streak:0,lastDay:"",pa:"",pb:"",unread:{}}; save(d); load(); toast("Freund addiert"); renderHome(); show("home"); };
  $("#comp").onsubmit=e=>{ e.preventDefault(); const t=$("#minp").value.trim(); if(!t||!S.active) return; $("#minp").value=""; send(S.active,{from:S.user.id,type:"text",text:t}); };
  $("#btn-emo").onclick=()=>$("#emo").classList.toggle("hidden");
  $("#emo").onclick=e=>{ if(e.target.tagName!=="BUTTON"||!S.active) return; send(S.active,{from:S.user.id,type:"text",text:e.target.textContent}); };
  $("#btn-pic").onclick=()=>$("#file").click();
  $("#file").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f||!S.active) return; send(S.active,{from:S.user.id,type:"img",image:await compress(f),text:""}); };
  $("#msgs").onclick=e=>{ const i=e.target.closest("img"); if(!i) return; $("#lbimg").src=i.src; $("#lb").classList.remove("hidden"); };
  $("#lb").onclick=()=>$("#lb").classList.add("hidden");
  $("#dock-cam").onclick=async()=>{ show("cam"); $("#shot").classList.add("hidden"); $("#vid").classList.remove("hidden"); $("#sendshot").classList.add("hidden"); $("#shut").classList.remove("hidden"); try{ S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}); $("#vid").srcObject=S.stream; }catch(e){ toast("Keine Kamera"); show("home"); } };
  $("#shut").onclick=()=>{ const v=$("#vid"), c=document.createElement("canvas"); c.width=v.videoWidth||720; c.height=v.videoHeight||960; c.getContext("2d").drawImage(v,0,0); S.shot=c.toDataURL("image/jpeg",.55); $("#shot").src=S.shot; $("#shot").classList.remove("hidden"); $("#vid").classList.add("hidden"); $("#shut").classList.add("hidden"); $("#sendshot").classList.remove("hidden"); stopCam(); };
  $("#sendshot").onclick=async()=>{ if(!S.shot) return; let target=S.active; if(!target){ const ids=Object.keys(S.friends); target=ids.length?cid(S.user.id,ids[0]):null; } if(!target){ toast("Erst einen Chat öffnen"); show("home"); return; } const blob=await (await fetch(S.shot)).blob(); S.active=target; send(target,{from:S.user.id,type:"img",image:await compress(blob),text:""}); show("chat"); renderChat(); };
  $("#copyu").onclick=async()=>{ try{ await navigator.clipboard.writeText(S.user.username); toast("Username kopiert"); }catch(e){ toast("@"+S.user.username); } };
  $("#save-st").onclick=()=>{ const d=db(); if(d.users[S.user.id]) d.users[S.user.id].status=$("#st-in").value.trim(); save(d); S.user.status=$("#st-in").value.trim(); toast("Status an"); };
  $$("[data-th]").forEach(b=>b.onclick=()=>{ document.body.className=b.dataset.th; localStorage.setItem(LS.th,b.dataset.th); toast("Theme an"); });
  $("#tog-snd").onclick=()=>{ S.snd=!S.snd; localStorage.setItem(LS.snd,S.snd?"1":"0"); toast(S.snd?"Sound an":"Sound aus"); };
  $("#out").onclick=()=>{ localStorage.removeItem(LS.s); S.user=null; show("auth"); };
}
document.body.className=localStorage.getItem(LS.th)||"";
bind();
setTimeout(()=>{ const sess=(()=>{try{return JSON.parse(localStorage.getItem(LS.s))}catch(e){return null}})(); if(sess){ const d=db(); const u=d.users[sess.id]; if(u){ after(u); return; } } show("auth"); },300);
})();
