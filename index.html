<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FLAME"/>
<meta name="theme-color" content="#050506"/>
<title>FLAME</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#050506;--card:#121216;--line:#ffffff12;--txt:#f6f3ee;--mut:#8e8a82;--flame:linear-gradient(135deg,#ffe600,#ff8a00 60%,#ff3b00);--me:#ff9f1a;--them:#1c1c22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--txt);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
#app{height:100%;max-width:430px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.hidden{display:none!important}
.logo{font-family:Syne,sans-serif;letter-spacing:.16em;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash,.auth{background:#050506}
.splash{align-items:center;justify-content:center;gap:8px}
.mark{width:86px;height:86px;border-radius:24px;background:var(--flame);display:grid;place-items:center;font-size:40px}
.card-up{margin-top:auto;padding:22px 18px 28px;background:#0c0c10;border-radius:26px 26px 0 0;border-top:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#08080c;padding:4px;border-radius:14px;margin:14px 0}
.tab{padding:11px;border-radius:11px;color:var(--mut);font-weight:800}
.tab.on{background:#1a1a20;color:#fff}
label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px}
input{width:100%;background:#08080c;border:1px solid var(--line);border-radius:14px;padding:13px}
.btn{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-weight:800}
.p{background:var(--flame);color:#111}
.g{background:#17171c;border:1px solid var(--line)}
.mini{width:auto;margin:0;padding:7px 12px;border-radius:999px;background:var(--flame);color:#111;font-size:12px}
.err{color:#ff5d73;font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:8px}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#111;font-weight:800;font-family:Syne,sans-serif;flex-shrink:0}
.av.s{width:34px;height:34px;border-radius:11px;font-size:14px}
.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 96px}
.row{display:flex;gap:10px;align-items:center;padding:11px;width:100%;text-align:left;border-radius:16px}
.row:active{background:#101014}
.grow{flex:1;min-width:0}
.name{font-weight:800}
.sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;padding:8px;background:#0e0e12f0;border:1px solid var(--line);border-radius:22px}
.dock b{color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dock b.on{color:#fff}
.bigcam{width:54px;height:54px;border-radius:18px;background:var(--flame);display:grid;place-items:center;font-size:22px;color:#111}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.bub{max-width:78%;padding:9px 11px;border-radius:16px;font-size:15px;line-height:1.35}
.me{align-self:flex-end;background:var(--me);color:#1a1000}
.them{align-self:flex-start;background:var(--them)}
.bub img{width:200px;max-width:66vw;border-radius:12px;display:block}
.meta{font-size:10px;opacity:.6;text-align:right;margin-top:3px}
.comp{display:flex;gap:6px;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.comp input{border-radius:999px}
.send{width:42px;height:42px;border-radius:14px;background:var(--flame);color:#111;flex-shrink:0}
.tray{display:flex;gap:8px;overflow:auto;padding:8px 10px;border-top:1px solid var(--line)}
.tray button{flex-shrink:0;font-size:22px}
.pad{padding:12px 16px 24px;overflow:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;z-index:40}
.empty{text-align:center;color:var(--mut);padding:36px 20px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#121216;color:var(--mut);font-size:12px}
.lb{position:absolute;inset:0;background:#000c;display:grid;place-items:center;z-index:50}
.lb img{max-width:100%;max-height:100%}
#vid,#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
.filters{display:flex;gap:8px;overflow:auto;padding:8px 0}
.fbtn{min-width:64px;padding:8px 6px;border-radius:14px;background:#0008;color:#fff;font-size:11px;font-weight:700}
.fbtn.on{outline:2px solid #ffe600}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #fff5;margin:8px auto}
.day{align-self:center;font-size:11px;color:var(--mut);background:#141418;padding:3px 8px;border-radius:99px}
</style>
</head>
<body>
<div id="app">
<section class="view splash on" id="v-splash"><div class="mark">🔥</div><h1 class="logo">FLAME</h1></section>

<section class="view auth" id="v-auth">
  <div class="card-up">
    <div class="mark" style="width:58px;height:58px;font-size:26px;margin:-48px auto 10px">🔥</div>
    <h1 class="logo" style="text-align:center;margin:0">FLAME</h1>
    <p class="sub" style="text-align:center;margin:6px 0 0">Nur Username. Keine E-Mail.</p>
    <div class="tabs"><button class="tab on" data-a="login">Login</button><button class="tab" data-a="reg">Neu</button></div>
    <form id="f-login"><label>Username</label><input id="l-user" maxlength="16" autocapitalize="none"><label>Passwort</label><input id="l-pass" type="password"><button class="btn p">Rein</button></form>
    <form id="f-reg" class="hidden"><label>Username</label><input id="r-user" maxlength="16" autocapitalize="none"><label>Name</label><input id="r-name" maxlength="18"><label>Passwort</label><input id="r-pass" type="password"><button class="btn p">Account</button></form>
    <p id="auth-err" class="err hidden"></p>
  </div>
</section>

<section class="view" id="v-home">
  <header class="top"><button class="ico av s" id="btn-me">F</button><span class="logo">FLAME</span><button class="ico" id="btn-add">＋</button></header>
  <div style="padding:0 14px 8px"><input id="q" placeholder="Suchen" style="border-radius:999px"></div>
  <div id="chats" class="list"></div>
  <nav class="dock"><b class="on" data-go="home">💬 Chats</b><button class="bigcam" id="dock-cam">📷</button><b data-go="friends">👥 Freunde</b></nav>
</section>

<section class="view" id="v-friends">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Freunde</b><button class="ico" id="btn-add2">＋</button></header>
  <div id="flist" class="list"></div>
</section>

<section class="view" id="v-add">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Adden</b><span></span></header>
  <div class="pad">
    <form id="f-add"><input id="add-u" placeholder="username" maxlength="16" autocapitalize="none"><button class="btn p">Hinzufügen</button></form>
    <p id="add-m" class="sub"></p>
    <div class="box"><b>Tipp</b><p class="sub">Dein Username steht im Profil. Den einfach schicken.</p></div>
  </div>
</section>

<section class="view" id="v-chat">
  <header class="top">
    <button class="ico" data-back="home">‹</button>
    <div class="grow" style="display:flex;gap:8px;align-items:center"><div class="av s" id="p-av">?</div><div><b id="p-name">—</b><div class="sub" id="p-st"></div></div></div>
    <div id="p-streak" class="chip hidden">🔥 0</div>
  </header>
  <div id="msgs" class="msgs"></div>
  <div id="tray" class="tray hidden">
    <button data-st="🔥">🔥</button><button data-st="😂">😂</button><button data-st="❤️">❤️</button><button data-st="😍">😍</button><button data-st="💀">💀</button><button data-st="👍">👍</button><button data-st="😭">😭</button><button data-st="🎉">🎉</button>
  </div>
  <form id="comp" class="comp">
    <button type="button" class="ico" id="btn-st">☺</button>
    <button type="button" class="ico" id="btn-pic">🖼</button>
    <input id="minp" maxlength="1200" placeholder="Nachricht">
    <button class="send">➤</button>
  </form>
  <input id="file" type="file" accept="image/*" hidden>
</section>

<section class="view" id="v-cam">
  <video id="vid" autoplay playsinline></video>
  <canvas id="cv" class="hidden"></canvas>
  <img id="preview" class="hidden" alt="">
  <div class="camui">
    <div style="display:flex;justify-content:space-between"><button class="ico" data-back="home" style="background:#0007">✕</button><b id="fname" style="align-self:center">Normal</b><span style="width:40px"></span></div>
    <div>
      <div class="filters" id="flist-f"></div>
      <button class="shutter" id="shut"></button>
      <button class="btn p hidden" id="sendshot" style="width:auto;margin:8px auto">Senden 🔥</button>
    </div>
  </div>
</section>

<section class="view" id="v-set">
  <header class="top"><button class="ico" data-back="home">‹</button><b>Profil</b><span></span></header>
  <div class="pad" style="text-align:center">
    <div class="av" id="me-av" style="width:82px;height:82px;border-radius:26px;font-size:28px;margin:6px auto">F</div>
    <h2 id="me-n" style="margin:6px 0 0">—</h2>
    <button class="chip" id="copyu" style="margin-top:8px">@<span id="me-u">—</span></button>
    <div class="box" style="text-align:left"><b>Status</b><input id="st-in" maxlength="50" style="margin-top:8px"><button class="btn g" id="save-st">Speichern</button></div>
    <button class="btn g" id="out">Abmelden</button>
  </div>
</section>

<div id="lb" class="lb hidden"><img id="lbimg" alt=""></div>
<div id="toast" class="toast hidden"></div>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {s:"fl3_s", d:"fl3_d"};
const BOT = {id:"bot", username:"flamebot", display:"FlameBot", online:true};
const S = {user:null, chats:{}, friends:{}, msgs:{}, users:{}, active:null, stream:null, shot:null, filter:"normal"};
const FILTERS = [
  {id:"normal", name:"Normal"},
  {id:"dog", name:"Hund"},
  {id:"cat", name:"Katze"},
  {id:"fish", name:"Catfish"},
  {id:"crown", name:"Krone"},
  {id:"cool", name:"Cool"},
  {id:"love", name:"Love"},
  {id:"glow", name:"Glow"},
  {id:"mono", name:"SW"},
  {id:"warm", name:"Warm"},
  {id:"ice", name:"Ice"}
];
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const now = () => Date.now();
const day = (t=Date.now()) => {const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const yest = dk => {const [y,m,da]=dk.split("-").map(Number); const x=new Date(y,m-1,da); x.setDate(x.getDate()-1); return day(x.getTime())};
const cid = (a,b)=>[a,b].sort().join("__");
const oth = (id,me)=>id.split("__").find(x=>x!==me);
const ini = n => (n||"?").trim()[0].toUpperCase();
const hue = s => {let h=0; for(const c of (s||"")) h=h*31+c.charCodeAt(0); return Math.abs(h)%360};
const avs = s => `background:linear-gradient(135deg,hsl(${hue(s)},90%,62%),hsl(${(hue(s)+35)%360},90%,48%))`;
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"),1600)}
function db(){ try{return JSON.parse(localStorage.getItem(LS.d))||base()}catch{return base()} }
function base(){return {users:{},names:{},friends:{},chats:{},msgs:{}}}
function save(d){ localStorage.setItem(LS.d, JSON.stringify(d)); }
async function sha(t){const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fl3::"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function show(n){ $$(".view").forEach(v=>v.classList.remove("on")); $("#v-"+n).classList.add("on"); if(n!=="cam") stopCam(); }

function seed(d){
  d.users.bot=BOT; d.names.flamebot="bot";
  if(!S.user) return d;
  d.friends[S.user.id]=d.friends[S.user.id]||{}; d.friends[S.user.id].bot=true;
  const id=cid(S.user.id,"bot");
  d.chats[id]=d.chats[id]||{id,a:S.user.id,b:"bot",lastText:"Frag mich was 🔥",lastAt:now(),streak:0,lastDay:"",pa:"",pb:"",unread:{[S.user.id]:1}};
  d.msgs[id]=d.msgs[id]||{};
  if(!Object.keys(d.msgs[id]).length) d.msgs[id].h={id:"h",from:"bot",type:"text",text:"Hey "+(S.user.display||"")+"! Ich bin FlameBot. Frag mich was, oder mach ein Foto mit Filter in der Kamera.",at:now()};
  return d;
}
function load(){
  const d=seed(db());
  S.users=d.users; S.friends=d.friends[S.user.id]||{};
  S.chats={}; Object.values(d.chats||{}).forEach(c=>{ if(c.a===S.user.id||c.b===S.user.id) S.chats[c.id]=c; });
  S.msgs=d.msgs||{};
}
function user(id){ if(id==="bot") return BOT; if(S.user&&S.user.id===id) return S.user; return S.users[id]||{display:"User",username:"user",id}; }
function streak(c){ if(!c) return 0; if(c.lastDay && c.lastDay!==day() && c.lastDay!==yest(day())) return 0; return c.streak||0; }
function fmt(t){const x=now()-t; if(x<6e4) return "jetzt"; if(x<36e5) return Math.floor(x/6e4)+"m"; return new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}
function clock(t){ return new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }

function renderHome(){
  $("#btn-me").textContent=ini(S.user.display);
  $("#btn-me").style.cssText=avs(S.user.username);
  const q=($("#q").value||"").toLowerCase();
  const rows=Object.values(S.chats).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0)).filter(c=>{
    const u=user(oth(c.id,S.user.id)); return !q || (u.display+" "+u.username).toLowerCase().includes(q);
  });
  $("#chats").innerHTML = rows.length ? rows.map(c=>{
    const u=user(oth(c.id,S.user.id)); const un=(c.unread&&c.unread[S.user.id])||0; const st=streak(c);
    return `<button class="row" data-open="${c.id}"><div class="av" style="${avs(u.username)}">${ini(u.display)}</div><div class="grow"><div class="name">${esc(u.display)} ${st?"🔥"+st:""}</div><div class="sub">${esc(c.lastText||"")}</div></div><div class="sub">${c.lastAt?fmt(c.lastAt):""}${un?" · "+un:""}</div></button>`;
  }).join("") : `<div class="empty">Keine Chats</div>`;
}
function renderFriends(){
  const ids=Object.keys(S.friends||{});
  $("#flist").innerHTML = ids.map(id=>{
    const u=user(id);
    return `<div class="row"><div class="av" style="${avs(u.username)}">${ini(u.display)}</div><div class="grow"><b>${esc(u.display)}</b><div class="sub">@${esc(u.username)}</div></div><button class="mini" data-open="${cid(S.user.id,id)}">Chat</button></div>`;
  }).join("") || `<div class="empty">Keine Freunde</div>`;
}
function renderChat(){
  const id=S.active; if(!id) return;
  const u=user(oth(id,S.user.id));
  $("#p-name").textContent=u.display; $("#p-st").textContent=u.id==="bot"?"Bot":"";
  $("#p-av").textContent=ini(u.display); $("#p-av").style.cssText=avs(u.username);
  const st=streak(S.chats[id]); $("#p-streak").classList.toggle("hidden",!st); $("#p-streak").textContent="🔥 "+st;
  const list=Object.values(S.msgs[id]||{}).sort((a,b)=>a.at-b.at).slice(-100);
  let last="";
  $("#msgs").innerHTML=list.map(m=>{
    const d=day(m.at); let sep=""; if(d!==last){sep=`<div class="day">${d===day()?"Heute":new Date(m.at).toLocaleDateString("de-DE")}</div>`; last=d;}
    const body=m.type==="img"?`<img src="${m.image}" alt="">`:`<div>${esc(m.text||"")}</div>`;
    return sep+`<div class="bub ${m.from===S.user.id?"me":"them"}">${body}<div class="meta">${clock(m.at)}</div></div>`;
  }).join("");
  $("#msgs").scrollTop=1e7;
}

function think(text, isImg){
  const t=(text||"").toLowerCase();
  const name=S.user.display||"du";
  if(isImg) return "Cleanes Foto. Filter war gut oder? Nächste Runde Hund oder Katze.";
  if(/hallo|hi|hey|yo|servus|moin/.test(t)) return "Hey "+name+"! Was geht?";
  if(/wer bist|was bist|wer bist du/.test(t)) return "FlameBot. Ich antworte hier im Chat. Echte Riesen-KI geht auf der Website nicht, weil der Schlüssel öffentlich wäre. Ich versteh dich trotzdem.";
  if(/filter|hund|katze|dog|cat|snap/.test(t)) return "Kamera unten in der Mitte. Dann Filter wählen: Hund, Katze, Catfish, Krone, Glow…";
  if(/streak|flamme|flame/.test(t)) return "Streak wächst, wenn ihr beide am selben Tag schreibt. Schreib jeden Tag, sonst geht sie aus.";
  if(/langweilig|blöde|dumm|random|schei|kacke/.test(t)) return "Okay, dann lieber so: sag mir ein Thema. Filter, Foto, Streak oder Freund adden.";
  if(/freund|adden|add|username/.test(t)) return "Oben rechts auf ＋, Username eintippen. Geht, wenn der Account auf diesem Handy existiert.";
  if(/foto|bild|cam|kamera/.test(t)) return "Gelber Kamera-Button unten. Filter drauf, auslösen, senden.";
  if(/danke|thx|thanks/.test(t)) return "Immer.";
  if(/liebe|love|herz/.test(t)) return "Love-Filter in der Kamera. Rosa Glow, fertig.";
  if(/wie geht|was geht|alles gut/.test(t)) return "Läuft. Und bei dir?";
  if(/spaß|witz|joke|lustig/.test(t)) return "Warum hat das Feuer keine Freunde? Weil alle Abstand halten. …ich weiß.";
  if(/hilfe|help|was kannst/.test(t)) return "Chatten, Fotos, Filter, Streaks, Freunde per Username. Frag einfach normal.";
  if(/\?/.test(t)) return "Gute Frage. Kurz: Kamera für Filter, ＋ für Freunde, jeden Tag schreiben für die Flamme.";
  if(t.length<8) return "Erzähl etwas mehr, dann kann ich besser antworten.";
  const bits=["Verstanden.","Okay.","Passt.","Notiert."];
  return bits[t.length%bits.length]+" Willst du Filter, Streak-Tipps oder jemanden adden?";
}

function applyStreak(c,from){
  const t=day(); if(c.a===from) c.pa=t; else c.pb=t;
  if(c.pa===t&&c.pb===t){ if(c.lastDay===t) return c; if(!c.lastDay||c.lastDay===yest(t)||!c.streak){c.streak=(c.lastDay===yest(t)?c.streak:0)+1; c.lastDay=t;} else {c.streak=1;c.lastDay=t;} }
  else if(c.lastDay&&c.lastDay!==t&&c.lastDay!==yest(t)) c.streak=0;
  return c;
}
function send(id,msg){
  msg.id=msg.id||uid(); msg.at=now();
  const d=db(); d.msgs[id]=d.msgs[id]||{}; d.msgs[id][msg.id]=msg;
  if(d.chats[id]){ applyStreak(d.chats[id],msg.from); d.chats[id].lastText=msg.type==="img"?"📷 Foto":msg.text; d.chats[id].lastAt=msg.at; d.chats[id].unread=d.chats[id].unread||{}; const o=oth(id,msg.from); d.chats[id].unread[o]=(d.chats[id].unread[o]||0)+1; }
  save(d); load(); if(S.active===id) renderChat(); renderHome();
  if(oth(id,S.user.id)==="bot" && msg.from===S.user.id) setTimeout(()=>send(id,{from:"bot",type:"text",text:think(msg.text,msg.type==="img")}),280);
}

function drawFilter(ctx,w,h,id){
  if(id==="mono"){ const im=ctx.getImageData(0,0,w,h); const p=im.data; for(let i=0;i<p.length;i+=4){ const g=p[i]*0.3+p[i+1]*0.59+p[i+2]*0.11; p[i]=p[i+1]=p[i+2]=g; } ctx.putImageData(im,0,0); return; }
  if(id==="warm"){ ctx.fillStyle="rgba(255,120,40,.18)"; ctx.fillRect(0,0,w,h); return; }
  if(id==="ice"){ ctx.fillStyle="rgba(80,180,255,.16)"; ctx.fillRect(0,0,w,h); return; }
  if(id==="glow"){ ctx.fillStyle="rgba(255,220,80,.12)"; ctx.fillRect(0,0,w,h); ctx.strokeStyle="rgba(255,240,120,.5)"; ctx.lineWidth=18; ctx.strokeRect(12,12,w-24,h-24); return; }
  const cx=w*0.5, ey=h*0.28, nx=cx, ny=h*0.46;
  if(id==="dog"){
    ctx.fillStyle="#6b3a1f";
    ear(-1); ear(1);
    ctx.beginPath(); ctx.ellipse(nx,ny+h*0.02,w*0.07,h*0.045,0,0,7); ctx.fillStyle="#111"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(nx,ny+h*0.07,w*0.045,h*0.05,0,0,7); ctx.fillStyle="#ff8aa0"; ctx.fill();
  }
  if(id==="cat"){
    ctx.fillStyle="#222";
    ctx.beginPath(); ctx.moveTo(cx-w*0.16,ey); ctx.lineTo(cx-w*0.06,ey-h*0.12); ctx.lineTo(cx-w*0.02,ey); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+w*0.16,ey); ctx.lineTo(cx+w*0.06,ey-h*0.12); ctx.lineTo(cx+w*0.02,ey); ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(nx+s*w*0.04,ny); ctx.lineTo(nx+s*w*0.22,ny-8); ctx.moveTo(nx+s*w*0.04,ny+6); ctx.lineTo(nx+s*w*0.22,ny+10); ctx.stroke(); }
    ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(nx,ny,w*0.025,0,7); ctx.fill();
  }
  if(id==="fish"){
    ctx.fillStyle="#3aa0ff";
    ctx.beginPath(); ctx.ellipse(cx,h*0.42,w*0.22,h*0.16,0,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx-w*0.07,h*0.4,w*0.035,0,7); ctx.arc(cx+w*0.07,h*0.4,w*0.035,0,7); ctx.fill();
    ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(cx-w*0.07,h*0.4,w*0.016,0,7); ctx.arc(cx+w*0.07,h*0.4,w*0.016,0,7); ctx.fill();
    ctx.fillStyle="#ff7aa2"; ctx.beginPath(); ctx.ellipse(cx,h*0.5,w*0.06,h*0.02,0,0,7); ctx.fill();
  }
  if(id==="crown"){
    ctx.fillStyle="#ffd000";
    ctx.beginPath(); ctx.moveTo(cx-w*0.16,ey); ctx.lineTo(cx-w*0.12,ey-h*0.1); ctx.lineTo(cx-w*0.04,ey); ctx.lineTo(cx,ey-h*0.12); ctx.lineTo(cx+w*0.04,ey); ctx.lineTo(cx+w*0.12,ey-h*0.1); ctx.lineTo(cx+w*0.16,ey); ctx.closePath(); ctx.fill();
  }
  if(id==="cool"){
    ctx.fillStyle="#111"; ctx.fillRect(cx-w*0.16,h*0.36,w*0.32,h*0.07);
    ctx.fillStyle="#66d0ff88"; ctx.fillRect(cx-w*0.15,h*0.37,w*0.13,h*0.05); ctx.fillRect(cx+w*0.02,h*0.37,w*0.13,h*0.05);
  }
  if(id==="love"){
    ctx.fillStyle="rgba(255,40,90,.16)"; ctx.fillRect(0,0,w,h);
    heart(cx-w*0.08,h*0.38,w*0.05); heart(cx+w*0.08,h*0.38,w*0.05);
  }
  function ear(dir){
    ctx.beginPath();
    ctx.ellipse(cx+dir*w*0.16,ey-h*0.02,w*0.07,h*0.1,-dir*0.5,0,7); ctx.fill();
  }
  function heart(x,y,s){
    ctx.fillStyle="#ff2d55";
    ctx.beginPath(); ctx.moveTo(x,y+s*0.3);
    ctx.bezierCurveTo(x-s,y-s*0.4,x-s,y+s*0.7,x,y+s);
    ctx.bezierCurveTo(x+s,y+s*0.7,x+s,y-s*0.4,x,y+s*0.3); ctx.fill();
  }
}

function snapFrame(){
  const v=$("#vid"), c=$("#cv");
  c.width=v.videoWidth||720; c.height=v.videoHeight||960;
  const ctx=c.getContext("2d");
  ctx.drawImage(v,0,0,c.width,c.height);
  drawFilter(ctx,c.width,c.height,S.filter);
  return c.toDataURL("image/jpeg",.58);
}

function stopCam(){ if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
async function after(u){ S.user=u; localStorage.setItem(LS.s,JSON.stringify({id:u.id})); save(seed(db())); load(); renderHome(); show("home"); }

function bind(){
  $$(".tab").forEach(t=>t.onclick=()=>{ $$(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on"); $("#f-login").classList.toggle("hidden",t.dataset.a!=="login"); $("#f-reg").classList.toggle("hidden",t.dataset.a!=="reg"); });
  $("#f-login").onsubmit=async e=>{ e.preventDefault(); try{ const d=db(); const id=d.names[$("#l-user").value.toLowerCase().trim()]; if(!id) throw new Error("User nicht gefunden"); const u=d.users[id]; if(u.pass!==await sha($("#l-pass").value)) throw new Error("Falsches Passwort"); after(u);}catch(err){ $("#auth-err").textContent=err.message; $("#auth-err").classList.remove("hidden"); } };
  $("#f-reg").onsubmit=async e=>{ e.preventDefault(); try{ const username=$("#r-user").value.toLowerCase().trim(); const display=$("#r-name").value.trim(); const pass=$("#r-pass").value; if(!/^[a-z0-9_]{3,16}$/.test(username)) throw new Error("Username: 3–16, a-z 0-9 _"); if(!display) throw new Error("Name fehlt"); if(pass.length<4) throw new Error("Passwort zu kurz"); const d=db(); if(d.names[username]) throw new Error("Username weg"); const u={id:uid(),username,display,pass:await sha(pass)}; d.users[u.id]=u; d.names[username]=u.id; save(d); after(u);}catch(err){ $("#auth-err").textContent=err.message; $("#auth-err").classList.remove("hidden"); } };
  $("#btn-me").onclick=()=>{ $("#me-av").textContent=ini(S.user.display); $("#me-av").style.cssText=avs(S.user.username)+"width:82px;height:82px;border-radius:26px;font-size:28px;margin:6px auto"; $("#me-n").textContent=S.user.display; $("#me-u").textContent=S.user.username; $("#st-in").value=S.user.status||""; show("set"); };
  $("#btn-add").onclick=$("#btn-add2").onclick=()=>{ $("#add-m").textContent=""; show("add"); };
  $$("[data-back]").forEach(b=>b.addEventListener("click",()=>{ load(); renderHome(); show(b.getAttribute("data-back")); }));
  $$(".dock b[data-go]").forEach(b=>b.onclick=()=>{ $$(".dock b").forEach(x=>x.classList.remove("on")); b.classList.add("on"); if(b.dataset.go==="friends"){renderFriends(); show("friends");} else {renderHome(); show("home");} });
  $("#q").oninput=renderHome;
  const open=e=>{ const r=e.target.closest("[data-open]"); if(!r) return; S.active=r.dataset.open; const d=db(); if(d.chats[S.active]){ d.chats[S.active].unread=d.chats[S.active].unread||{}; d.chats[S.active].unread[S.user.id]=0; save(d); load(); } renderChat(); show("chat"); };
  $("#chats").onclick=open; $("#flist").onclick=open;
  $("#f-add").onsubmit=e=>{ e.preventDefault(); const name=$("#add-u").value.toLowerCase().trim(); const d=db(); const id=d.names[name]; if(!id){ $("#add-m").textContent="Username nicht gefunden."; return; } if(id===S.user.id){ $("#add-m").textContent="Das bist du."; return; } d.friends[S.user.id]=d.friends[S.user.id]||{}; d.friends[id]=d.friends[id]||{}; d.friends[S.user.id][id]=true; d.friends[id][S.user.id]=true; const idc=cid(S.user.id,id); d.chats[idc]=d.chats[idc]||{id:idc,a:S.user.id,b:id,lastText:"Verbunden 🔥",lastAt:now(),streak:0,lastDay:"",pa:"",pb:"",unread:{}}; save(d); load(); toast("Freund da"); renderHome(); show("home"); };
  $("#comp").onsubmit=e=>{ e.preventDefault(); const t=$("#minp").value.trim(); if(!t||!S.active) return; $("#minp").value=""; send(S.active,{from:S.user.id,type:"text",text:t}); };
  $("#btn-st").onclick=()=>$("#tray").classList.toggle("hidden");
  $("#tray").onclick=e=>{ const b=e.target.closest("[data-st]"); if(!b||!S.active) return; send(S.active,{from:S.user.id,type:"text",text:b.dataset.st}); };
  $("#btn-pic").onclick=()=>$("#file").click();
  $("#file").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f||!S.active) return; const img=new Image(); const url=URL.createObjectURL(f); await new Promise(r=>{img.onload=r; img.src=url}); const c=document.createElement("canvas"); const sc=Math.min(1,900/Math.max(img.width,img.height)); c.width=img.width*sc; c.height=img.height*sc; c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); send(S.active,{from:S.user.id,type:"img",image:c.toDataURL("image/jpeg",.55)}); };
  $("#msgs").onclick=e=>{ const i=e.target.closest("img"); if(!i) return; $("#lbimg").src=i.src; $("#lb").classList.remove("hidden"); };
  $("#lb").onclick=()=>$("#lb").classList.add("hidden");
  $("#flist-f").innerHTML=FILTERS.map(f=>`<button class="fbtn ${f.id==="normal"?"on":""}" data-f="${f.id}">${f.name}</button>`).join("");
  $("#flist-f").onclick=e=>{ const b=e.target.closest("[data-f]"); if(!b) return; S.filter=b.dataset.f; $$(".fbtn").forEach(x=>x.classList.toggle("on",x===b)); $("#fname").textContent=FILTERS.find(x=>x.id===S.filter).name; };
  $("#dock-cam").onclick=async()=>{ show("cam"); $("#preview").classList.add("hidden"); $("#vid").classList.remove("hidden"); $("#sendshot").classList.add("hidden"); $("#shut").classList.remove("hidden"); try{ S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}); $("#vid").srcObject=S.stream; }catch{ toast("Keine Kamera"); show("home"); } };
  $("#shut").onclick=()=>{ S.shot=snapFrame(); $("#preview").src=S.shot; $("#preview").classList.remove("hidden"); $("#vid").classList.add("hidden"); $("#shut").classList.add("hidden"); $("#sendshot").classList.remove("hidden"); stopCam(); };
  $("#sendshot").onclick=()=>{ if(!S.shot) return; let target=S.active; if(!target){ const ids=Object.keys(S.friends); target=ids.length?cid(S.user.id,ids[0]):null; } if(!target){ toast("Erst Chat öffnen"); show("home"); return; } S.active=target; send(target,{from:S.user.id,type:"img",image:S.shot}); show("chat"); renderChat(); };
  $("#copyu").onclick=async()=>{ try{ await navigator.clipboard.writeText(S.user.username); toast("Kopiert"); }catch{ toast("@"+S.user.username); } };
  $("#save-st").onclick=()=>{ const d=db(); if(d.users[S.user.id]) d.users[S.user.id].status=$("#st-in").value.trim(); save(d); toast("Gespeichert"); };
  $("#out").onclick=()=>{ localStorage.removeItem(LS.s); S.user=null; show("auth"); };
}
bind();
setTimeout(()=>{ const sess=(()=>{try{return JSON.parse(localStorage.getItem(LS.s))}catch{return null}})(); if(sess){ const u=db().users[sess.id]; if(u){ after(u); return; } } show("auth"); },280);
})();
</script>
